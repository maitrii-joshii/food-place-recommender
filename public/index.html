<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo-container">
                <span class="emoji">🍽️</span>
                <h1>Food Recommender</h1>
            </div>
            <p class="subtitle">AI-powered dining recommendations tailored for you.</p>
        </header>

        <section class="glass-panel" id="form-section">
            <form id="preferences-form">
                <div class="form-group">
                    <label for="location">City / Location <span class="required">*</span></label>
                    <select id="location" name="location" required>
                        <option value="" disabled selected>Loading cities...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Budget <span class="required">*</span></label>
                    <select id="budget" name="budget" required>
                        <option value="" disabled selected>Select a budget</option>
                        <option value="low">Low (Affordable)</option>
                        <option value="medium">Medium (Moderate)</option>
                        <option value="high">High (Premium)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cuisine">Cuisine (Optional)</label>
                    <input type="text" id="cuisine" name="cuisine" placeholder="e.g., Italian, North Indian, Chinese" list="cuisine-options">
                    <datalist id="cuisine-options">
                        <!-- Populated dynamically -->
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="min_rating">Minimum Rating (0 - 5)</label>
                    <input type="number" id="min_rating" name="min_rating" min="0" max="5" step="0.1" value="4.0">
                </div>

                <div class="form-group full-width">
                    <label for="extra_preferences">Extra Preferences (Optional)</label>
                    <input type="text" id="extra_preferences" name="extra_preferences" placeholder="e.g., outdoor seating, family-friendly, live music">
                </div>

                <button type="submit" id="submit-btn">
                    <span class="btn-text">Find Places</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </section>

        <section id="results-section" class="hidden">
            <div class="results-header">
                <h2>Top Recommendations</h2>
                <button id="reset-btn" class="secondary-btn">Search Again</button>
            </div>
            
            <div id="loading-state" class="hidden">
                <div class="shimmer-card"></div>
                <div class="shimmer-card"></div>
            </div>

            <div id="recommendations-container">
                <!-- Results go here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
